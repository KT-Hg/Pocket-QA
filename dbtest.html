<!DOCTYPE html>
<!-- dbtest.html — Test sessions & rollback.

     Two columns: the sessions recorded against every connection on the left,
     one session's changes on the right. The panel inside Adminer deliberately
     shows almost nothing — it is 300px wide and sits on top of somebody's work —
     so everything that needs reading lives here: the per-column before/after of
     each change, which changes cannot be undone and why, and the settings.

     Rollback is *driven* from here but does not *run* here. A fetch from an
     extension page to the Adminer host is cross-site, and the PHP session cookie
     would not be sent with it, so this page asks an open Adminer tab to do the
     work and shows what comes back. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Test Sessions &amp; Rollback</title>
  <link rel="stylesheet" href="css/tool-base.css" />
  <link rel="stylesheet" href="css/dbtools.css" />
</head>
<body>

  <header class="topbar">
    <button id="btnRail" class="t-btn t-btn-icon" data-i18n-title="mgr.railToggle">☰</button>
    <span class="topbar-title">🗄️ <span data-i18n="mgr.title"></span></span>
    <span class="topbar-sub" data-i18n="mgr.subtitle"></span>
    <div class="topbar-actions">
      <button id="btnSettings" class="t-btn" data-i18n="mgr.settings"></button>
      <button id="btnLang" class="t-btn" data-i18n-title="mgr.langTip">🌐 <span id="langLabel">VI</span></button>
      <button id="toggleTheme" class="t-btn t-btn-icon" data-i18n-title="mgr.themeTip">🌙</button>
    </div>
  </header>

  <div class="app" id="app">
    <aside class="rail">
      <div class="rail-head">
        <span class="pane-label" data-i18n="mgr.sessions"></span>
        <button id="btnCleanup" class="t-btn t-btn-sm t-btn-ghost" data-i18n="mgr.cleanup"></button>
        <button id="btnRailClose" class="t-btn t-btn-icon t-btn-ghost" data-i18n-title="mgr.railCollapse">⟨</button>
      </div>
      <div class="rail-body">
        <input id="railFilter" class="rail-filter" type="search" hidden />
        <div id="sessionList" class="session-list"></div>
      </div>
    </aside>

    <main class="main">
      <div id="detailHead" class="detail-head" hidden>
        <div class="detail-title">
          <span id="sessName" class="sess-name"></span>
          <span id="sessState" class="pill"></span>
        </div>
        <div id="sessMeta" class="meta"></div>
        <div class="row">
          <button id="btnRollback" class="t-btn t-btn-danger" data-i18n="mgr.rollbackSelected"></button>
          <button id="btnRedo"       class="t-btn" data-i18n="mgr.redoSelected"></button>
          <button id="btnExportSql"  class="t-btn" data-i18n="mgr.exportSql"></button>
          <button id="btnExportJson" class="t-btn" data-i18n="mgr.exportJson"></button>
          <button id="btnRename"     class="t-btn" data-i18n="mgr.rename"></button>
          <button id="btnToggleOpen" class="t-btn"></button>
          <button id="btnDelete"     class="t-btn t-btn-danger-outline" data-i18n="mgr.delete"></button>
        </div>
        <div id="report" class="report" hidden></div>
      </div>

      <div id="extras" class="extras" hidden></div>

      <div id="changeHead" class="change-head" hidden>
        <label><input type="checkbox" id="chkAll" /> <span data-i18n="mgr.selectAll"></span></label>
        <span id="changeCount" class="meta"></span>
      </div>

      <div id="changeList" class="change-list">
        <p class="empty" data-i18n="mgr.noPreview"></p>
      </div>
    </main>

    <button type="button" id="railReopen" class="rail-reopen" data-i18n="mgr.railReopen" hidden></button>
  </div>

  <dialog id="settingsDlg" class="modal dlg">
    <form method="dialog" class="dlg-body">
      <h2 data-i18n="mgr.settings"></h2>
      <label class="check"><input type="checkbox" id="setEnabled" /> <span data-i18n="mgr.enabled"></span></label>
      <label class="check"><input type="checkbox" id="setAutoExecute" /> <span data-i18n="mgr.autoExecute"></span></label>
      <label class="check"><input type="checkbox" id="setDrift" /> <span data-i18n="mgr.driftCheck"></span></label>
      <label class="check"><input type="checkbox" id="setCompact" /> <span data-i18n="mgr.compactRun"></span></label>
      <label class="check"><input type="checkbox" id="setSqlPage" /> <span data-i18n="mgr.captureSqlPage"></span></label>
      <label class="field"><span data-i18n="mgr.prefetchLimit"></span><input type="number" id="setLimit" min="1" max="5000" /></label>
      <label class="field"><span data-i18n="mgr.snapshotLimit"></span><input type="number" id="setSnapLimit" min="1" max="100000" /></label>
      <label class="field"><span data-i18n="mgr.keyScanLimit"></span><input type="number" id="setKeyLimit" min="1" max="200000" /></label>
      <label class="field"><span data-i18n="mgr.engineOverride"></span>
        <select id="setEngine">
          <option value=""></option>
          <option value="mysql">mysql</option>
          <option value="pgsql">pgsql</option>
          <option value="mssql">mssql</option>
          <option value="sqlite">sqlite</option>
          <option value="oracle">oracle</option>
        </select>
      </label>
      <p id="storageUsed" class="meta"></p>
      <fieldset class="guard">
        <legend data-i18n="mgr.guard"></legend>
        <label class="check"><input type="checkbox" id="setGuard" /> <span data-i18n="mgr.guardEnabled"></span></label>
        <label class="field"><span data-i18n="mgr.guardConn"></span><select id="setGuardConn"></select></label>
        <label class="field"><span data-i18n="mgr.guardTables"></span><input type="text" id="setGuardTables" placeholder="m_generic, m_config" /></label>
        <label class="check"><input type="checkbox" id="setGuardAuto" /> <span data-i18n="mgr.guardAuto"></span></label>
      </fieldset>
      <div class="dlg-foot"><button id="setOk" class="t-btn t-btn-primary" value="close">OK</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast toast-success" role="status" aria-live="polite" aria-atomic="true" hidden></div>

  <script type="module" src="dbtools/manager.js"></script>
</body>
</html>
